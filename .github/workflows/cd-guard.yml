name: CD Guard

# Guarda da fila de deploy. Existe porque a fila do CD já travou cinco vezes, sempre em
# silêncio: um run em `waiting` (esperando aprovação) segura o grupo `cd-production`, e
# todo CD seguinte entra em `pending` SEM criar job — não chega ao gate, não aparece como
# "Review deployments", e é cancelado quando o próximo é enfileirado. Resultado: CI verde,
# nada sobe, nenhum erro em lugar nenhum (#919). Na última vez um agente conferiu a
# correção em produção, viu que não funcionava e escreveu um relato de bug detalhado —
# diagnosticando código que não estava rodando (#1220).
#
# Este workflow NÃO entra no grupo `cd-production` de propósito: se entrasse, travaria
# junto com aquilo que deveria destravar.

on:
  # Um CI verde na main significa que um CD novo está a caminho: qualquer run ainda
  # em `waiting` é de um commit mais antigo e está segurando a fila.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Rede de segurança: se ninguém empurrar código por um tempo, ainda queremos saber que
  # a produção ficou atrás da main.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # cancelar runs obsoletos da fila

concurrency:
  group: cd-guard
  cancel-in-progress: true

jobs:
  guard:
    name: Destravar a fila e conferir a produção
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Um run em `waiting` só é obsoleto quando existe commit mais novo para deployar.
      # No gatilho de CI isso é verdade por construção. No agendado NÃO é — ali um run
      # esperando pode ser legítimo (o Bruno ainda vai aprovar), então só avisamos.
      # SÓ cancela run de OUTRO commit. O CD deste mesmo commit entra em `waiting` no
      # mesmo instante que este guard roda, então "tudo que está esperando é antigo" é
      # falso — e na primeira execução real isso cancelou justamente o deploy que deveria
      # proteger, deixando a fila pior do que sem guard nenhum.
      - name: Cancelar runs obsoletos que seguram a fila
        if: github.event_name == 'workflow_run'
        env:
          SHA_ATUAL: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$SHA_ATUAL" ]; then
            echo "::warning::Sem SHA do CI — não dá para saber o que é obsoleto; nada cancelado."
            exit 0
          fi
          echo "Commit atual: ${SHA_ATUAL:0:8} — runs deste commit são preservados."

          OBSOLETOS=$(gh run list --workflow=deploy.yml --limit 30 \
                        --json databaseId,headSha,status,createdAt \
                        -q "map(select(.status==\"waiting\" and .headSha != \"$SHA_ATUAL\"))
                            | .[] | \"\(.databaseId) \(.headSha[0:8]) \(.createdAt)\"")
          if [ -z "$OBSOLETOS" ]; then
            echo "Nenhum run obsoleto em waiting — fila livre."
            exit 0
          fi
          echo "$OBSOLETOS" | while read -r id sha criado; do
            echo "::warning::Cancelando CD $id ($sha, de $criado) — é de um commit anterior e estava segurando a fila."
            gh run cancel "$id" || echo "  (já não era cancelável)"
          done
          echo "Fila liberada. O CD de ${SHA_ATUAL:0:8} chega ao gate e aparece para aprovação."

      # Também pega runs em `pending`: são os que nunca criaram job porque a fila estava
      # presa. Eles não são visíveis como "aguardando aprovação" em lugar nenhum.
      - name: Conferir se a produção ficou atrás da main
        run: |
          set -o pipefail
          MAIN=$(git rev-parse origin/main)
          # `--status success` NÃO devolve o run mais recente (medido: trouxe um de 08/09
          # enquanto o de hoje estava success). Filtrar por conclusion no jq, que respeita
          # a ordem natural do mais novo para o mais antigo.
          ULTIMO_OK=$(gh run list --workflow=deploy.yml --limit 50 \
                        --json headSha,conclusion \
                        -q 'map(select(.conclusion=="success")) | .[0].headSha // ""')
          echo "main:                 $MAIN"
          echo "último CD com sucesso: ${ULTIMO_OK:-nenhum}"

          EMBARGADOS=$(gh run list --workflow=deploy.yml --limit 30 \
                         --json databaseId,status,headSha,createdAt \
                         -q '.[] | select(.status=="waiting" or .status=="pending") | "\(.status) \(.databaseId) \(.headSha[0:8]) \(.createdAt)"')
          if [ -n "$EMBARGADOS" ]; then
            echo "Runs de CD retidos:"; echo "$EMBARGADOS" | sed 's/^/  /'
          fi

          if [ -z "$ULTIMO_OK" ]; then
            echo "Nenhum deploy bem-sucedido no histórico consultado — nada a comparar."
            exit 0
          fi
          if [ "$ULTIMO_OK" = "$MAIN" ]; then
            echo "Produção está no commit da main."
            exit 0
          fi

          ATRAS=$(git rev-list --count "$ULTIMO_OK".."$MAIN" 2>/dev/null || echo "?")

          # Esperando o Bruno aprovar NÃO é fila travada. Acusar deriva aqui transformaria
          # todo deploy normal em falha vermelha, e alarme que toca sempre ninguém lê.
          VIVO=$(gh run list --workflow=deploy.yml --limit 30 \
                   --json headSha,status \
                   -q "map(select(.headSha==\"$MAIN\" and (.status==\"waiting\" or .status==\"pending\" or .status==\"in_progress\" or .status==\"queued\"))) | length")
          if [ "${VIVO:-0}" -gt 0 ]; then
            echo "A main está $ATRAS commit(s) à frente, mas há deploy deste commit em andamento ou aguardando aprovação. Nada travado."
            exit 0
          fi

          echo "::error::A main está $ATRAS commit(s) à frente do último deploy bem-sucedido ($ULTIMO_OK) e NÃO há deploy deste commit na fila. Algo travou em silêncio — confira os runs retidos acima e cancele os obsoletos."
          exit 1
