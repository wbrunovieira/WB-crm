name: CD

# Deploy contínuo → VPS Contabo via Ansible, como o usuário NÃO-root `deploy`
# (chave dedicada; sudo escopado apenas a pm2 restart/status e ao script de backup).
#
# Gates de segurança:
#   1. Só dispara quando o workflow CI termina VERDE na main (nunca em PR).
#   2. Environment `production` exige APROVAÇÃO MANUAL (required reviewer).
#   3. Host key do VPS pinada em deploy/ci/known_hosts (sem TOFU/keyscan em runtime).
#   4. Migrations: se o diff entre o commit deployado e a main tocar
#      backend/prisma/migrations/, roda deploy-backend (backup → migrate → swap)
#      ANTES do quick-deploy — código novo nunca sobe sem a coluna existir.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      playbook:
        description: "O que deployar"
        type: choice
        options: [auto, quick-deploy, deploy-backend]
        default: auto

permissions:
  contents: read

# Um deploy por vez; nunca cancela um deploy em andamento.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → VPS Contabo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_run: só se o CI concluiu com sucesso. workflow_dispatch: sempre permite
    # (o environment ainda exige aprovação manual).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://crm.wbdigitalsolutions.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # histórico completo p/ detectar migrations pendentes

      # ssh-agent manual (sem action de terceiro tocando a chave privada)
      - name: Start ssh-agent with deploy key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "$SSH_DEPLOY_KEY"

      - name: Pin VPS host key (no TOFU)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          grep -v '^#' deploy/ci/known_hosts > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Detecção pelo ESTADO DO BANCO, não por diff de SHA.
      #
      # O diff de SHA mentia. Em `workflow_run` o checkout traz o HEAD atual da main, não
      # o commit que disparou o run; e o playbook faz reset para origin/main. Então, ao
      # aprovar um run antigo, servidor e checkout acabavam no MESMO commit, o diff saía
      # vazio e a migration era pulada — código novo no ar sem a coluna existir (#697).
      # `_prisma_migrations` não tem esse problema: ela diz o que o banco realmente tem.
      - name: Detect pending migrations
        timeout-minutes: 5
        id: detect
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -o pipefail
          # Credenciais vêm do env do próprio container — nada de senha no workflow.
          LIDAS=$(ssh -o BatchMode=yes "$VPS" \
            'docker exec crm_postgres sh -c '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NOT NULL"'"'"'' \
            2>/dev/null | tr -d '\r' | sed '/^$/d' | sort) || LIDAS=""

          if [ -z "$LIDAS" ]; then
            echo "::warning::Não consegui ler _prisma_migrations — assumindo migrations pendentes (default seguro)"
            echo "migrate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NO_REPO=$(ls backend/prisma/migrations/ | grep -v migration_lock | sort)
          PENDENTES=$(comm -23 <(echo "$NO_REPO") <(echo "$LIDAS"))

          echo "Aplicadas no banco: $(echo "$LIDAS" | wc -l) | no repositório: $(echo "$NO_REPO" | wc -l)"
          if [ -n "$PENDENTES" ]; then
            echo "migrate=true" >> "$GITHUB_OUTPUT"
            printf '::notice::Migrations pendentes:\n%s\n' "$PENDENTES"
          else
            echo "migrate=false" >> "$GITHUB_OUTPUT"
            echo "Sem migrations pendentes."
          fi

      - name: Install Ansible
        timeout-minutes: 10
        run: pipx install ansible-core

      # Inventory do CI: usuário deploy, SEM become global (o ansible.cfg do repo tem
      # become=True pro fluxo local como root; aqui o sudo é explícito e escopado
      # dentro dos próprios comandos dos playbooks).
      - name: Build CI inventory
        working-directory: deploy/ansible
        run: |
          cat > inventory/ci.yml <<EOF
          all:
            hosts:
              crm_server:
                ansible_host: ${{ secrets.VPS_HOST }}
                ansible_user: ${{ secrets.VPS_USER }}
                ansible_become: false
                ansible_python_interpreter: /usr/bin/python3.9
          EOF

      - name: Deploy backend com migração (backup → migrate → swap)
        timeout-minutes: 25
        if: (steps.detect.outputs.migrate == 'true' && inputs.playbook != 'quick-deploy') || inputs.playbook == 'deploy-backend'
        working-directory: deploy/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: ansible-playbook -i inventory/ci.yml playbooks/deploy-backend.yml

      - name: Deploy frontend + backend (quick-deploy)
        timeout-minutes: 25
        if: inputs.playbook != 'deploy-backend'
        working-directory: deploy/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: ansible-playbook -i inventory/ci.yml playbooks/quick-deploy.yml

      # Prova de que o deploy chegou ao ar. Sem isto, um deploy "verde" podia deixar a
      # produção rodando outro commit e ninguém via — foi o que levou um agente a
      # diagnosticar código que não estava rodando e relatar um bug inexistente (#1220).
      - name: Confirmar o que ficou em produção
        if: always() && (steps.detect.conclusion == 'success')
        timeout-minutes: 5
        env:
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          NO_AR=$(ssh -o BatchMode=yes "$VPS" 'cd /opt/wb-crm && git --no-pager rev-parse HEAD' | tr -d '\r')
          MAIN=$(git rev-parse origin/main)
          echo "Em produção: $NO_AR"
          echo "main:        $MAIN"

          PENDENTES=$(ssh -o BatchMode=yes "$VPS" \
            'docker exec crm_postgres sh -c '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL"'"'"'' \
            2>/dev/null | tr -d '\r\n ') || PENDENTES="?"
          # `rolled_back_at IS NULL` é essencial: há 6 migrations que falharam em 2026 e
          # foram resolvidas como revertidas. Elas ficam para sempre com finished_at nulo.
          # Sem esse filtro esta checagem falharia em TODO deploy — alarme falso permanente
          # é pior que checagem nenhuma, porque ensina a ignorar o alarme.
          echo "Migrations travadas (não finalizadas e não revertidas): $PENDENTES"

          if [ "$NO_AR" != "$MAIN" ]; then
            echo "::error::Produção está em $NO_AR, mas a main está em $MAIN. O deploy não levou o código esperado — NÃO trate esta versão como publicada."
            exit 1
          fi
          if [ "$PENDENTES" != "0" ] && [ "$PENDENTES" != "?" ]; then
            echo "::error::Há $PENDENTES migration(s) travada(s) no banco (iniciada, não finalizada, não revertida). Código novo pode estar no ar sem o schema correspondente."
            exit 1
          fi
          echo "Confirmado: produção está no commit da main e o schema está íntegro."
