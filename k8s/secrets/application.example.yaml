---

# Sample — copy to secrets/application.yaml, fill in real values, then
# `kubectl apply -f secrets/application.yaml`. Not part of the kustomization
# (secrets are managed out-of-band).
apiVersion: v1
kind: Secret
metadata:
  name: application
type: Opaque
stringData:
  # Mandatory keys:

  # ── Auth ──────────────────────────────────────────────────────────────────
  # NextAuth (frontend) and NestJS JWT (backend) MUST share the same value:
  # the API verifies session tokens minted by NextAuth.
  NEXTAUTH_JWT_SECRET: change-me-openssl-rand-base64-32
  # Server-to-server auth (cron triggers, internal APIs).
  WEBHOOK_SECRET: change-me
  INTERNAL_API_KEY: change-me
  # for seeding:
  ADMIN_PASSWORD: "super-super-password"

  # ── calendar-finances ─────────────────────────────────────────────────────
  FINANCE_API_SECRET: ""

  # ── META Graph API ────────────────────────────────────────────────────────
  META_USER_TOKEN: "dummy"

  # Optional keys (i.e. can also be undefined):

  # ── GoTo Connect (calls, recordings, transcription) ───────────────────────
  GOTO_CLIENT_ID: "your-goto-client-id"
  GOTO_CLIENT_SECRET: "your-goto-client-secret"
  GOTO_ACCOUNT_KEY: "your-goto-account-key"
  GOTO_WEBHOOK_SECRET: "generate-with-openssl-rand-base64-32"
  GOTO_DEFAULT_OWNER_ID: "their-goto-client-id"

  # ── WhatsApp (Evolution API) ──────────────────────────────────────────────
  EVOLUTION_API_URL: ""
  EVOLUTION_API_KEY: ""
  EVOLUTION_INSTANCE: ""
  EVOLUTION_WEBHOOK_SECRET: ""
  EVOLUTION_DEFAULT_OWNER_ID: ""

  # ── Google (Gmail, Meet, OAuth, Places) ───────────────────────────────────
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  GOOGLE_PLACES_API_KEY: "your-google-places-api-key"

  # ── AWS S3 (GoTo recordings, activity photos, presential meetings) ────────
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: ""
  AWS_S3_GOTO_BUCKET: ""
  AWS_S3_ACTIVITY_PHOTOS_BUCKET: ""
  AWS_S3_PRESENTIAL_BUCKET: ""

  # ── Transcriber / AI agents ───────────────────────────────────────────────
  TRANSCRIPTOR_BASE_URL: ""
  TRANSCRIPTOR_API_KEY: ""
  TRANSCRIPTION_CALLBACK_URL: ""
  TRANSCRIPTION_CALLBACK_SECRET: ""
  TRANSCRIBER_CALLBACK_SECRET: ""
  CALL_ANALYSIS_AGENT_URL: ""
  MEET_ANALYSIS_AGENT_URL: ""
  GATEKEEPER_ANALYSIS_AGENT_URL: ""
  GATEKEEPER_BATCH_AGENT_URL: ""
  TRANSFER_ANALYSIS_AGENT_URL: ""
  PROPOSAL_AGENT_SECRET: ""
  PROPOSAL_DRIVE_FOLDER: ""
