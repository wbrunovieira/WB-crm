---
# Quick Deploy — atualização de código (frontend PM2 + container do backend)
#
# Use para:
#   - Mudanças de frontend/UI, correções, patches
#   - Mudanças de CÓDIGO do backend SEM migração de schema
#
# ⚠️  MIGRAÇÕES rodam em deploy-backend.yml (o backend é a autoridade do Prisma).
#
# Endurecido em 02/09/2026. O que mudou e por quê:
#   - `raw` → `command`/`shell`. O `raw` existe para hosts sem Python; este tem
#     (python3.9, confirmado). O preço do `raw` era um PTY em toda tarefa: qualquer
#     comando que peça input trava para sempre. Foi o pager do `git log` e depois o
#     prompt de senha do `git fetch`, que queimou os 30 min de timeout do CD.
#   - `environment:` desarma qualquer prompt do git de uma vez, em vez de repetir a
#     variável em cada comando e esquecer em um.
#   - Preflight antes de tocar em qualquer coisa (tasks/preflight.yml).
#   - `timeout:` em toda tarefa que fala com a rede ou compila.
#   - `retries` nas tarefas de rede, que são as que falham de forma intermitente.
#
# Uso:
#   ansible-playbook -i inventory/production.yml playbooks/quick-deploy.yml

- name: Quick Deploy - Code Update Only
  hosts: crm_server
  gather_facts: no

  vars:
    app_dir: /opt/wb-crm
    app_name: wb-crm
    github_branch: main
    min_free_gb: 5

  # Vale para TODAS as tarefas: o git nunca pode esperar por input num deploy não
  # interativo. Sem terminal ele falha em segundos com mensagem legível; com terminal
  # (o que o `raw` dava) ele esperava até o job morrer.
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GIT_ASKPASS: /bin/true
    GIT_PAGER: cat

  tasks:
    - name: Info
      ansible.builtin.debug:
        msg: "🚀 QUICK DEPLOY — {{ app_name }} @ {{ github_branch }}"

    - name: Preflight
      ansible.builtin.import_tasks: tasks/preflight.yml

    # ── Código ────────────────────────────────────────────────────────────────

    - name: Buscar código do GitHub
      ansible.builtin.command:
        cmd: git fetch origin {{ github_branch }}
        chdir: "{{ app_dir }}"
      register: git_fetch
      changed_when: false
      timeout: 120
      retries: 3
      delay: 10
      until: git_fetch.rc == 0

    - name: Aplicar código
      ansible.builtin.command:
        cmd: git reset --hard origin/{{ github_branch }}
        chdir: "{{ app_dir }}"
      timeout: 120

    - name: Commit deployado
      ansible.builtin.command:
        cmd: git --no-pager log -1 --oneline
        chdir: "{{ app_dir }}"
      register: git_commit
      changed_when: false
      timeout: 30

    - name: Mostrar commit
      ansible.builtin.debug:
        msg: "Commit: {{ git_commit.stdout }}"

    - name: Remover arquivos de desenvolvimento
      # docker-compose.yml e backend/ ficam — são necessários para o container NestJS.
      ansible.builtin.file:
        path: "{{ app_dir }}/{{ item }}"
        state: absent
      loop:
        - tests
        - docs
        - vitest.config.ts
        - CLAUDE.md
        - .vscode
        - .eslintrc.json
        - .prettierrc.json

    # ── Frontend ──────────────────────────────────────────────────────────────

    - name: Instalar dependências (inclui dev, necessárias para o build)
      ansible.builtin.command:
        cmd: npm ci --production=false
        chdir: "{{ app_dir }}"
      timeout: 900

    - name: Build do Next.js
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ app_dir }}"
      environment:
        NODE_OPTIONS: "--max-old-space-size=4096"
        NODE_ENV: production
      timeout: 1200

    - name: Remover dependências de desenvolvimento
      ansible.builtin.command:
        cmd: npm prune --production
        chdir: "{{ app_dir }}"
      timeout: 600

    - name: Reiniciar PM2 (frontend)
      # sudo com caminho absoluto: o PM2 roda no daemon do root. Funciona como root
      # (local) e como o usuário `deploy` do CD (sudoers escopado).
      ansible.builtin.command: sudo /usr/bin/pm2 restart {{ app_name }}
      timeout: 120

    # ── Backend ───────────────────────────────────────────────────────────────

    - name: Rebuild da imagem do backend
      ansible.builtin.command:
        cmd: docker compose --profile backend build backend
        chdir: "{{ app_dir }}"
      timeout: 900

    - name: Subir o container do backend
      ansible.builtin.command:
        cmd: docker compose --profile backend up -d backend
        chdir: "{{ app_dir }}"
      timeout: 300

    # ── Health checks ─────────────────────────────────────────────────────────

    - name: Health check do frontend
      ansible.builtin.uri:
        url: http://localhost:3000
        status_code: [200, 307, 302]
        timeout: 10
      register: front_health
      retries: 12
      delay: 5
      until: front_health.status is defined and front_health.status in [200, 307, 302]

    - name: Health check do backend (boot frio do NestJS leva até ~2min)
      ansible.builtin.uri:
        url: http://localhost:3010/health
        timeout: 10
      register: back_health
      retries: 24
      delay: 5
      until: back_health.status is defined and back_health.status == 200

    - name: Resultado
      ansible.builtin.debug:
        msg: |
          ✅ QUICK DEPLOY CONCLUÍDO
          Commit  : {{ git_commit.stdout }}
          Frontend: {{ front_health.status }} — https://crm.wbdigitalsolutions.com
          Backend : {{ back_health.status }} — https://crm-api.wbdigitalsolutions.com
