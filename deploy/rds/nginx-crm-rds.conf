# crm-rds.wbdigitalsolutions.com → frontend da instância RDS (PM2 wb-crm-rds, :3001)
server {
    listen 80;
    server_name crm-rds.wbdigitalsolutions.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm-rds.wbdigitalsolutions.com;

    ssl_certificate     /etc/nginx/certs/crm-rds.wbdigitalsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/crm-rds.wbdigitalsolutions.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
