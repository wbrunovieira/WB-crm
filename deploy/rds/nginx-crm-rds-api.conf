# crm-rds-api.wbdigitalsolutions.com → backend da instância RDS (container :3011)
# O app mobile (perfil RDS) fala com esta URL.
server {
    listen 80;
    server_name crm-rds-api.wbdigitalsolutions.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm-rds-api.wbdigitalsolutions.com;

    ssl_certificate     /etc/nginx/certs/crm-rds-api.wbdigitalsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/crm-rds-api.wbdigitalsolutions.com/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
